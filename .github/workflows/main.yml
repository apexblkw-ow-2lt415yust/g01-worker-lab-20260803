name: g01-cross-repo-artifact-read

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Attempt protected artifact read
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: g01-private-artifact-source
          repository: apexblkw-ow-2lt415yust/g01-private-control-20260803
          run-id: 30854116091
          github-token: ${{ github.token }}
          path: foreign
      - name: Observe artifact consumer result
        run: |
          printf "download_outcome=%s\\n" "${{ steps.fetch.outcome }}"
          if [ -f foreign/secret.txt ]; then
            printf "foreign_artifact_sentinel="
            cat foreign/secret.txt
          else
            printf "foreign_artifact_absent\\n"
          fi
