name: g01-cross-repo-write

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Controlled cross-repository write probe
        required: true
        default: cross-repo-write-baseline
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROBE: ${{ inputs.probe }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Probe protected repository write boundary
        run: |
          set -u
          printf "%s\\n" "$PROBE"
          response=$(mktemp)
          status=$(curl -sS -o "$response" -w "%{http_code}" -X PUT -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d '{"message":"G01 cross-repository write probe","content":"RzAxX0NST1NTX1JFUE9fV1JJVEVfMjAyNjA4MDNfQjRNOFQx","branch":"main"}' "https://api.github.com/repos/apexblkw-ow-2lt415yust/g01-private-control-20260803/contents/worker-cross-repo-probe.txt")
          printf "private_write_status=%s\\n" "$status"
          if [ "$status" = "200" ] || [ "$status" = "201" ]; then
            printf "cross_repo_write_sentinel=G01_CROSS_REPO_WRITE_20260803_B4M8T1\\n"
          fi
