name: g01-artifact-probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Controlled artifact parser probe
        required: true
        default: artifact-baseline
        type: string

jobs:
  producer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Build crafted archive fixture
        run: |
          set -u
          mkdir -p artifact/nested
          printf "G01_ARTIFACT_NORMAL_20260803\\n" > artifact/normal.txt
          printf "G01_ARTIFACT_NESTED_20260803\\n" > artifact/nested/inside.txt
          ln -s /etc/hostname artifact/host-symlink
          tar -cf artifact/traversal.tar --transform="s,^artifact/normal.txt,../../../../tmp/G01_ARTIFACT_ESCAPE.txt," artifact/normal.txt
          printf "fixture=%s\\n" "${{ inputs.probe }}"
          find artifact -maxdepth 3 -printf "%y %p -> %l\\n"
      - name: Upload crafted artifact
        uses: actions/upload-artifact@v4
        with:
          name: g01-artifact-probe
          path: artifact
          include-hidden-files: true
  consumer:
    needs: producer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: g01-artifact-probe
          path: downloaded
      - name: Inspect downstream artifact consumer
        run: |
          set -u
          find downloaded -maxdepth 4 -printf "%y %p -> %l\\n"
          if [ -L downloaded/host-symlink ]; then printf "symlink_preserved=%s\\n" "$(readlink downloaded/host-symlink)"; fi
          if [ -f downloaded/host-symlink ]; then printf "symlink_materialized_size=%s\\n" "$(wc -c < downloaded/host-symlink)"; fi
          tar -tvf downloaded/traversal.tar
