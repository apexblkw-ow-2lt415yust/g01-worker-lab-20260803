name: G01 Results JS Runtime Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Probe Results service from Action process
        uses: actions/github-script@v7
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN || "";
            const base = process.env.ACTIONS_RESULTS_URL || "https://results-receiver.actions.githubusercontent.com";
            core.info(`runtime_url=${base}`);
            core.info(`runtime_token_length=${token.length}`);
            const service = "github.actions.results.api.v1.ArtifactService";
            const requests = [
              {method: "ListArtifacts", body: {workflow_run_backend_id: "30854116091", workflow_job_run_backend_id: ""}},
              {method: "GetSignedArtifactURL", body: {workflow_run_backend_id: "30854116091", workflow_job_run_backend_id: "", name: "g01-private-artifact-source"}}
            ];
            for (const item of requests) {
              const response = await fetch(`${base}/twirp/${service}/${item.method}`, {
                method: "POST",
                headers: {Authorization: `Bearer ${token}`, "Content-Type": "application/json"},
                body: JSON.stringify(item.body)
              });
              const body = await response.text();
              core.info(`${item.method} status=${response.status} body=${body.slice(0, 1400)}`);
              if (item.method === "GetSignedArtifactURL" && response.ok) {
                try {
                  const signed = JSON.parse(body).signed_url;
                  if (signed) {
                    const download = await fetch(signed);
                    const bytes = Buffer.from(await download.arrayBuffer());
                    core.info(`signed_fetch_status=${download.status} bytes=${bytes.length} sentinel=${bytes.includes(Buffer.from("G01_PRIVATE_ARTIFACT_SENTINEL_20260803_C9P3L7"))}`);
                  }
                } catch (error) {
                  core.info(`signed_fetch_error=${error.message}`);
                }
              }
            }
name: G01 Results JS Runtime Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Probe Results service from Action process
        uses: actions/github-script@v7
        env:
          TARGET_ARTIFACT_ID: 8871751823
          TARGET_RUN_ID: 30854116091
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN || "";
            const base = process.env.ACTIONS_RESULTS_URL || "https://results-receiver.actions.githubusercontent.com";
            core.info(`runtime_url=${base}`);
            core.info(`runtime_token_length=${token.length}`);
            const paths = [
              `/_apis/artifact/Artifacts?workflowRunBackendId=${process.env.TARGET_RUN_ID}`,
              `/_apis/artifact/Artifact?artifactId=${process.env.TARGET_ARTIFACT_ID}`,
              `/twirp/github.actions.results.api.v1.ArtifactService/GetSignedArtifactURL`,
              `/twirp/github.actions.results.api.v1.ArtifactService/GetArtifact`
            ];
            for (const path of paths) {
              const options = {headers: {Authorization: `Bearer ${token}`}};
              if (path.includes("twirp")) {
                options.method = "POST";
                options.headers["Content-Type"] = "application/json";
                options.body = JSON.stringify({artifactId: Number(process.env.TARGET_ARTIFACT_ID), workflowRunBackendId: Number(process.env.TARGET_RUN_ID)});
              }
              const response = await fetch(`${base}${path}`, options);
              const body = await response.text();
              core.info(`${path} status=${response.status} body=${body.slice(0, 1000)}`);
            }

